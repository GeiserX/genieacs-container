name: Docs

# The docs workflow for a repo whose gh-pages branch is ALSO its Helm chart
# repository: index.yaml and artifacthub-repo.yml live there (the .tgz packages
# are release assets that index.yaml points at), and `helm repo add
# https://geiserx.github.io/<repo>` reads them from the Pages URL. Pumperly,
# LynxPrompt and genieacs-container are in this case.
#
# The site therefore stays on the branch flow: build strictly, rsync the site
# into a checkout of gh-pages with the Helm files excluded, commit, push. Never
# the artifact flow of docs-pages.yml (Pages then stops serving the branch, so
# a chart release would publish an index nobody can fetch until the next docs
# deploy). The `gh-pages` concurrency group is shared with the chart release
# workflow (helm/chart-releaser-action) so the two never push at once: add the
# same `concurrency` block to that workflow's push job, AND a run-level
# `concurrency: {group: chart-${{ github.ref }}, cancel-in-progress: false}` at
# the top of release-chart.yml. GitHub keeps one pending job per group, so
# without the run-level lock two chart releases queued on gh-pages beside a
# docs deploy cancel each other (a cancelled chart run is covered by the newer
# one: chart-releaser releases every chart changed since the last tag).
#
# Zensical has no --site-dir flag and site_dir must stay inside the repo, so
# the deploy job builds into the default site/ and rsyncs from there.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
      - '.github/scripts/site-check.py'
      # Add every file a page includes with pymdownx.snippets.
  # No paths filter on pull requests: a filtered-out required check blocks the merge.
  pull_request:
  workflow_dispatch:

# One run at a time per ref, never cancelled. GitHub keeps one running and one
# pending run per group, and a run that joins later replaces the pending one.
# Runs join in the order GitHub queues them, which is not promised to be push
# order, so a newer push is likely, not certain, to deploy last.
# The deploy job also holds the `gh-pages` group shared with the chart release.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; a persisted token is readable by pip and by the build.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install dependencies
        run: pip install -r docs/requirements-docs.txt

      - name: Build
        run: python -m zensical build --clean --strict

      - name: Check the built site
        run: python -I .github/scripts/site-check.py site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This checkout only builds; the gh-pages checkout below keeps its token for the push.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r docs/requirements-docs.txt

      - name: Build
        run: python -m zensical build --clean --strict

      - name: Check the built site
        run: python -I .github/scripts/site-check.py site

      - name: Check out gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      # rsync --delete removes stale site files but leaves the excluded Helm
      # files alone. The two `test -f` lines are the gate: if either file is
      # missing after the sync, nothing is pushed.
      - name: Sync the site into gh-pages, keeping the Helm repository
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'index.yaml' \
            --exclude 'artifacthub-repo.yml' \
            --exclude '*.tgz' \
            site/ gh-pages/
          touch gh-pages/.nojekyll
          test -f gh-pages/index.yaml
          test -f gh-pages/artifacthub-repo.yml

      - name: Commit and push
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes."
            exit 0
          fi
          git commit -m "docs: deploy ${GITHUB_SHA::7}"
          git push origin gh-pages
