name: Release Helm Chart

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'charts/genieacs/**'
      - '.github/workflows/release-chart.yml'
  workflow_dispatch:

# One chart release at a time per ref. GitHub keeps only one pending job per
# concurrency group, so without this a second chart release could wait on
# `gh-pages` beside a docs deploy and cancel it, or be cancelled by it. A newer
# run still covers a cancelled one: chart-releaser releases every chart changed
# since the last release tag.
concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # gh-pages is also the docs site: docs.yml syncs the site into it. Both
    # workflows take this lock so they never push to the branch at once.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          config: .github/cr.yaml
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
