name: Helm chart

# Runs on every pull request and every push to main, with no path filter, so
# the required `chart` check always reports.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v4.3.0
  KIND_VERSION: v0.33.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  chart:
    name: chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
          rm kubeconform.tar.gz
          kubeconform -v

      - name: Build chart dependencies
        run: helm dependency build charts/genieacs

      - name: helm lint
        run: helm lint --strict charts/genieacs --set env.GENIEACS_UI_JWT_SECRET="$(openssl rand -hex 32)"

      - name: Secret guard and kubeconform
        run: .github/scripts/chart-guard.sh

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          cluster_name: chart-ci

      - name: Install in kind, check the secret, the UI and a refused upgrade
        run: .github/scripts/chart-install.sh
