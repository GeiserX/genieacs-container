version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: docker
    labels:
      - docker
      - automated
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      docker_security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - ci
      - automated
    groups:
      github-actions:
        patterns:
          - '*'
      github_actions_security:
        applies-to: security-updates
        patterns:
          - '*'
  # The docs site's one pin (zensical). Monthly: the strict build and
  # site-check in the Docs workflow prove each bump.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    commit-message:
      prefix: build(docs)
    labels:
      - documentation
      - automated
